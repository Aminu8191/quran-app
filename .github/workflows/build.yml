name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download and build audio (release audio-v1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audio_dl/extra && cd audio_dl
          gh release download audio-v1 --repo "${{ github.repository }}" -p 'Quran32k.zip.part*'
          cat Quran32k.zip.part* > Quran32k.zip
          unzip -q Quran32k.zip
          gh release download audio-v1 --repo "${{ github.repository }}" -p '049.m4a' -D extra
          cd ..
          bash scripts/build_audio.sh audio_dl/Quran32k audio_dl/extra app/src/main/assets/audio
          rm -rf audio_dl
          COUNT=$(ls app/src/main/assets/audio | wc -l)
          echo "Audio files: $COUNT"
          test "$COUNT" -eq 108

      - name: Prepare signing key (optional)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore"
          else
            echo "No keystore secret: using debug signing (fine for testing only)"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Publish APK to Release "apk-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FullQuran.apk
          ls -lh FullQuran.apk
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --title "Full Quran App (latest APK)" --notes "Download FullQuran.apk below."
          gh release upload apk-latest FullQuran.apk --clobber
