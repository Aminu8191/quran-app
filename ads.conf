# ===== ADS DEFAULTS (built into the app; remote ads.json can override) =====
# format: interstitial | banner | app_open | none | banner+interstitial
format=banner

# AdMob App ID (never remote). This is Google's TEST app id. Replace with yours later.
admob_app_id=ca-app-pub-8567720425475375~5900265684

# Ad unit ids (Google TEST ids below). Replace with yours later.
unit_first=ca-app-pub-8567720425475375/9982980928
unit_return=ca-app-pub-8567720425475375/3996157074
unit_banner=ca-app-pub-8567720425475375/4298664543
unit_app_open=ca-app-pub-8567720425475375/7061304118

# Minimum seconds between full-screen ads (0 = every return)
return_min_gap_sec=20

# How long (ms) to wait for the first ad at launch before opening the app anyway
first_wait_ms=5000

# Remote config (public HTTPS raw link to ads.json in your repo)
remote_config_url=https://raw.githubusercontent.com/Aminu8191/quran-app/main/ads.json
